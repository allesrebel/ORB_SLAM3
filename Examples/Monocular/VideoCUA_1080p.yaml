%YAML:1.0

#--------------------------------------------------------------------------------------------
# System config — VideoCUA_1080p
#
# Adapted from ScreenCapture.yaml for VideoCUA's native 1920x1080 @ 30 fps videos.
# Intrinsics scaled by 1.5x from the 1280x720 reference (fx_new = 800 * 1920/1280 = 1200).
# Principal point centered at (W/2, H/2). No lens distortion (flat virtual surface).
# All ORB-SLAM3 fork extension flags (deadlines, OASIS, OmegaSLAM, PIDSLAM, SlimSLAM)
# left disabled — this is the plain monocular config.
#--------------------------------------------------------------------------------------------

File.version: "1.0"

Camera.type: "PinHole"

Camera1.fx: 1200.0
Camera1.fy: 1200.0
Camera1.cx: 960.0
Camera1.cy: 540.0

Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.k3: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

Camera.width:  1920
Camera.height: 1080

Camera.newWidth:  1920
Camera.newHeight: 1080

Camera.fps: 30

Camera.RGB: 0

#--------------------------------------------------------------------------------------------
# ORB Parameters — same as ScreenCapture.yaml; UI features are sparse so iniThFAST
# stays low to encourage initialization.
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 12
ORBextractor.minThFAST: 2

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
Viewer.imageViewScale: 1.0

#--------------------------------------------------------------------------------------------
# Fork extension defaults — all OFF for this plain run.
#--------------------------------------------------------------------------------------------
System.thFarPoints:     1000.0
System.enableDeadlines: 0
System.enableFOV:       0
System.maskHeight:      0
System.maskWidth:       0
System.enableOasis:     0
System.dumpMapPoints:   0
System.enableOmegaSLAM: 0
System.enablePIDSLAM:   0
SlimSLAM.Enable:        0
SlimSLAM.EnableTraining: 0
System.debug_logs:      0
